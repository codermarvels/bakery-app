name: Deploy Edge Functions

# Run by hand: GitHub → Actions → "Deploy Edge Functions" → Run workflow.
# Needs one repository SECRET: SUPABASE_ACCESS_TOKEN
# (Supabase → your avatar → Account preferences → Access Tokens → Generate new token).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ckepiiynmdspwqqxlhzw
    steps:
      - uses: actions/checkout@v5

      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Missing secret::Add SUPABASE_ACCESS_TOKEN under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Settings such as verify_jwt come from supabase/config.toml.
      - name: Deploy payments and razorpay-webhook
        run: |
          supabase functions deploy payments --project-ref "$PROJECT_REF"
          supabase functions deploy razorpay-webhook --project-ref "$PROJECT_REF"
