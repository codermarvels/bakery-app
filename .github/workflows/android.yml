name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional overrides (Settings → Secrets and variables → Actions). When empty, the public
      # project defaults in gradle.properties are used.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Fail if a server-only secret was ever committed. Only the publishable key may be in code.
      - name: Check no secret keys are committed
        run: |
          if git grep -nIE 'sb_secret_[A-Za-z0-9_-]+|"role" *: *"service_role"|service_role_key *=' -- ':!.github/workflows/android.yml'; then
            echo "::error title=Secret key in repository::Remove the secret key above and rotate it in the Supabase dashboard."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Show which Supabase project the APK uses
        run: |
          CONFIG=app/build/generated/source/buildConfig/debug/com/vsjbakery/app/BuildConfig.java
          grep 'SUPABASE_URL' "$CONFIG"
          if grep -q 'SUPABASE_URL = "https://' "$CONFIG" && grep -q 'SUPABASE_PUBLISHABLE_KEY = "sb_publishable_' "$CONFIG"; then
            echo "Sign-in is configured in this APK."
          else
            echo "::warning title=Sign-in disabled in this APK::No Supabase URL / publishable key was found at build time."
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vsj-bakery-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Release build: shrunk with R8, exactly what goes to Google Play. Signed with the upload
      # key when the RELEASE_KEYSTORE_BASE64 secret is set (see docs/RELEASE.md); otherwise with
      # the debug key, which is only good for testing on an emulator.
      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "VSJ_RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "RELEASE_KIND=signed-for-play" >> "$GITHUB_ENV"
          else
            echo "::notice title=Release build uses the test key::Add the RELEASE_KEYSTORE_BASE64 secret to produce a Play Store upload."
            echo "RELEASE_KIND=TEST-ONLY-debug-signed" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and bundle
        env:
          VSJ_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          VSJ_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          VSJ_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Remove the decoded signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: vsj-bakery-release-${{ env.RELEASE_KIND }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
