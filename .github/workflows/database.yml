name: Database tests

on:
  push:
    branches: [main, "claude/**"]
    paths: ["supabase/**", ".github/workflows/database.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/database.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations-and-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts the real Supabase Postgres image locally in Docker and applies every migration.
      - name: Start database and apply migrations
        run: supabase db start

      # Runs the pgTAP security tests in supabase/tests/database.
      - name: Row Level Security tests
        run: supabase test db

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Type-checks the Edge Functions and runs their unit tests (no real Razorpay calls).
      - name: Edge Function checks and tests
        run: |
          deno check supabase/functions/payments/index.ts supabase/functions/razorpay-webhook/index.ts
          deno test supabase/functions
